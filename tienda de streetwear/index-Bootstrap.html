<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tienda de sneakers y ropa urbana.">
    <title>Tienda Streetwear - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main id="app-bootstrap" class="container py-5">
        <h1 class="h2 mb-4">Tienda de Sneakers y Ropa Urbana</h1>
        <button id="body_btNuevaPrenda" class="btn btn-primary mb-3" type="button">Nueva prenda</button>

        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Código</th>
                        <th>Marca</th>
                        <th>Costo</th>
                        <th>Tipo de prenda</th>
                        <th>Características</th>
                        <th class="text-end">Precio final</th>
                        <th class="text-end">Ganancia neta</th>
                        <th class="text-end">Puntos Drop</th>
                    </tr>
                </thead>
                <tbody id="body_tbPrendas"></tbody>
            </table>
        </div>

        <section class="card mt-4">
            <h2 class="card-header h5 mb-0">Resumen de la tienda</h2>
            <div class="card-body">
                <p>Ganancia total: <strong id="body_lblGananciaTotal" class="text-success">$0.00</strong></p>
                <p>Código con mayor ganancia: <strong id="body_lblCodigoMayor">—</strong></p>
                <p class="mb-0">Total de puntos Drop: <strong id="body_lblTotalPuntosDrop">0 pts</strong></p>
            </div>
        </section>
    </main>

    <div class="modal fade" id="prenda" tabindex="-1" aria-labelledby="prd_titulo" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="prd_titulo" class="modal-title fs-5">Registrar prenda</h2>
                </div>
                <form id="prd_form">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="prd_inCodigo" class="form-label">Código</label>
                            <input id="prd_inCodigo" class="form-control" type="text" maxlength="20" required>
                        </div>
                        <div class="mb-3">
                            <label for="prd_inMarca" class="form-label">Marca</label>
                            <input id="prd_inMarca" class="form-control" type="text" maxlength="60" required>
                        </div>
                        <div class="mb-3">
                            <label for="prd_inCosto" class="form-label">Costo ($)</label>
                            <input id="prd_inCosto" class="form-control" type="number" min="0.01" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label for="prd_selTipo" class="form-label">Tipo de prenda</label>
                            <select id="prd_selTipo" class="form-select">
                                <option value="sneaker">Sneaker</option>
                                <option value="hoodie">Hoodie</option>
                            </select>
                        </div>
                        <div id="prd_rowSneaker" class="form-check">
                            <input id="prd_chkAltaDemanda" class="form-check-input" type="checkbox">
                            <label for="prd_chkAltaDemanda" class="form-check-label">Alta demanda (+10%)</label>
                        </div>
                        <div id="prd_rowHoodie" hidden>
                            <div class="form-check">
                                <input id="prd_chkEstampado" class="form-check-input" type="checkbox">
                                <label for="prd_chkEstampado" class="form-check-label">Estampado (+$8)</label>
                            </div>
                            <div class="form-check">
                                <input id="prd_chkColeccionPasada" class="form-check-input" type="checkbox">
                                <label for="prd_chkColeccionPasada" class="form-check-label">Colección pasada (-$6)</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button id="prd_btCancelar" class="btn btn-secondary" type="button">Cancelar</button>
                        <button class="btn btn-success" type="submit">Registrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import cStore from "./dist/controllers/cStore.js";
        import cPrenda from "./dist/controllers/cPrenda.js";
        import vStoreBootstrap from "./dist/views/vStoreBootstrap.js";
        import vPrendaBootstrap from "./dist/views/vPrendaBootstrap.js";

        const vistaStore = new vStoreBootstrap();
        const vistaPrenda = new vPrendaBootstrap();
        const controladorPrenda = new cPrenda(vistaPrenda);
        new cStore(vistaStore, controladorPrenda);
    </script>
</body>
</html>
